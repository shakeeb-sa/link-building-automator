<!DOCTYPE html>
<html>
  <head>
    <title>Lightning LinkBuilder</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 350px;
        padding: 15px;
        background: #f8f9fa;
        color: #333;
      }
      /* --- HEADER & CONTROLS --- */
      .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
      h3 { margin: 0; font-size: 16px; color: #2d3436; }
      
      .control-panel {
        background: white;
        padding: 10px;
        border: 1px solid #dfe6e9;
        border-radius: 8px;
        margin-bottom: 15px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      }
      .profile-row { display: flex; gap: 5px; margin-bottom: 8px; }
      select { flex-grow: 1; padding: 6px; border-radius: 4px; border: 1px solid #ccc; }
      
      .btn-group { display: flex; gap: 5px; }
      button.icon-btn {
        flex: 1; padding: 6px; font-size: 12px; cursor: pointer;
        background: #fff; border: 1px solid #b2bec3; border-radius: 4px;
        transition: all 0.1s;
      }
      button.icon-btn:hover { background: #f1f2f6; }
      button.icon-btn.danger:hover { background: #ff7675; color: white; border-color: #ff7675; }

      /* --- FORM STYLES --- */
      label { display: block; font-size: 11px; font-weight: 700; color: #636e72; margin-top: 8px; margin-bottom: 2px; }
      input[type="text"], input[type="email"], input[type="password"], input[type="tel"] {
        width: 100%; padding: 8px; border: 1px solid #dfe6e9;
        border-radius: 4px; box-sizing: border-box; font-size: 13px;
      }
      input:focus { outline: 2px solid #74b9ff; border-color: transparent; }

      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

      #masterInput {
        width: 100%; min-height: 80px; border: 1px solid #dfe6e9;
        padding: 8px; background: white; border-radius: 4px;
        font-size: 12px; box-sizing: border-box; overflow-y: auto;
        font-family: monospace;
      }

      /* --- FOOTER ACTIONS --- */
      .footer { margin-top: 20px; border-top: 1px solid #dfe6e9; padding-top: 15px; }
      .primary-btn {
        width: 100%; padding: 10px; background-color: #0984e3;
        color: white; border: none; cursor: pointer; border-radius: 4px;
        font-weight: 600; font-size: 14px;
      }
      .primary-btn:hover { background-color: #0066cc; }

      .io-actions { display: flex; justify-content: space-between; margin-top: 10px; }
      .io-btn { font-size: 11px; color: #636e72; cursor: pointer; text-decoration: underline; border: none; background: none; }
      
      #status { text-align: center; color: #00b894; font-weight: bold; font-size: 12px; height: 15px; margin-top: 5px; }
    </style>
  </head>
  <body>
    <div class="header">
      <h3>⚡ Agency Hub</h3>
      <div id="status"></div>
    </div>

    <!-- PROFILE MANAGER -->
    <div class="control-panel">
      <div class="profile-row">
        <select id="profileSelect"></select>
        <button class="icon-btn" id="newBtn" title="New Profile">➕</button>
      </div>
      <div class="btn-group">
        <button class="icon-btn" id="renameBtn">Rename</button>
        <button class="icon-btn danger" id="deleteBtn">Delete</button>
      </div>
    </div>

    <!-- FORM FIELDS -->
    <div class="scroll-area">
      <label>Username</label> <input type="text" id="username" />
      <label>Email</label> <input type="email" id="email" />
      <label>Password</label> <input type="password" id="password" />
      
      <div class="grid">
        <div><label>First Name</label><input type="text" id="firstName"></div>
        <div><label>Last Name</label><input type="text" id="lastName"></div>
      </div>

      <label>Company / Brand</label> <input type="text" id="company" />
      <label>Website URL</label> <input type="text" id="website" />
      <label>Title / Subject</label> <input type="text" id="title" />
      <label>Category (Classifieds)</label> <input type="text" id="category" placeholder="e.g. Services" />
      
      <div class="grid">
        <div><label>Phone</label><input type="tel" id="phone"></div>
        <div><label>Zip</label><input type="text" id="zip"></div>
      </div>
      
      <label>Address</label> <input type="text" id="address" />
      
      <div class="grid">
        <div><label>City</label><input type="text" id="city"></div>
        <div><label>State/Region</label><input type="text" id="region"></div>
      </div>
      <label>Country</label> <input type="text" id="country" placeholder="United States" />

      <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
      
      <label>Description / Bio (Rich Text or HTML)</label>
      <div id="masterInput" contenteditable="true"></div>
    </div>

    <div class="footer">
      <button id="saveButton" class="primary-btn">💾 Save Profile</button>
      
      <div class="io-actions">
        <button id="exportBtn" class="io-btn">⬇️ Backup (JSON)</button>
        <button id="importBtn" class="io-btn">⬆️ Restore</button>
        <!-- Hidden Input for File Upload -->
        <input type="file" id="fileInput" style="display:none" accept=".json">
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
