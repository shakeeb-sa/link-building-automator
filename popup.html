<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Lightning LinkBuilder</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        width: 350px;
        padding: 15px;
        background: #f8f9fa;
        color: #333;
      }
      /* --- HEADER & CONTROLS --- */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }
      h3 {
        margin: 0;
        font-size: 16px;
        color: #2d3436;
      }

      .control-panel {
        background: white;
        padding: 10px;
        border: 1px solid #dfe6e9;
        border-radius: 8px;
        margin-bottom: 15px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .profile-row {
        display: flex;
        gap: 5px;
        margin-bottom: 8px;
      }
      select {
        flex-grow: 1;
        padding: 6px;
        border-radius: 4px;
        border: 1px solid #ccc;
      }

      .btn-group {
        display: flex;
        gap: 5px;
      }
      button.icon-btn {
        flex: 1;
        padding: 6px;
        font-size: 12px;
        cursor: pointer;
        background: #fff;
        border: 1px solid #b2bec3;
        border-radius: 4px;
        transition: all 0.1s;
      }
      button.icon-btn:hover {
        background: #f1f2f6;
      }
      button.icon-btn.danger:hover {
        background: #ff7675;
        color: white;
        border-color: #ff7675;
      }

      /* --- FORM STYLES --- */
      label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        color: #636e72;
        margin-top: 8px;
        margin-bottom: 2px;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="tel"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #dfe6e9;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 13px;
      }
      input:focus {
        outline: 2px solid #74b9ff;
        border-color: transparent;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      #masterInput {
        width: 100%;
        min-height: 80px;
        border: 1px solid #dfe6e9;
        padding: 8px;
        background: white;
        border-radius: 4px;
        font-size: 12px;
        box-sizing: border-box;
        overflow-y: auto;
        font-family: monospace;
      }

      /* --- FOOTER ACTIONS --- */
      .footer {
        margin-top: 20px;
        border-top: 1px solid #dfe6e9;
        padding-top: 15px;
      }
      .primary-btn {
        width: 100%;
        padding: 10px;
        background-color: #0984e3;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 4px;
        font-weight: 600;
        font-size: 14px;
      }
      .primary-btn:hover {
        background-color: #0066cc;
      }

      .io-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
      }
      .io-btn {
        font-size: 11px;
        color: #636e72;
        cursor: pointer;
        text-decoration: underline;
        border: none;
        background: none;
      }

      #status {
        text-align: center;
        color: #00b894;
        font-weight: bold;
        font-size: 12px;
        height: 15px;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h3>⚡ Agency Hub</h3>
      <div id="status"></div>
    </div>

    <!-- PROFILE MANAGER -->
    <div class="control-panel">
      <div class="profile-row">
        <select id="profileSelect"></select>
        <button class="icon-btn" id="newBtn" title="New Profile">➕</button>
        <!-- ⚡ NEW IMPORT BUTTON -->
        <button
          class="icon-btn"
          id="bulkBtn"
          title="Smart Bulk Import"
          style="font-weight: bold; color: #0984e3"
        >
          ⚡ Import
        </button>
      </div>
      <div class="btn-group">
        <button class="icon-btn" id="renameBtn">Rename</button>
        <button class="icon-btn danger" id="deleteBtn">Delete</button>
      </div>
    </div>

    <!-- WATCHTOWER -->
    <div class="control-panel" style="border-left: 4px solid #d63031">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <strong>🛡️ Watchtower</strong>
        <span id="dbStatus" style="font-size: 10px; color: #aaa">Inactive</span>
      </div>

      <div id="uploadView">
        <label
          style="
            cursor: pointer;
            margin-top: 8px;
            display: block;
            text-align: center;
            border: 1px dashed #ccc;
            padding: 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #555;
          "
        >
          📂 Upload Master Excel (.xlsx)
          <input
            type="file"
            id="xlsxInput"
            accept=".xlsx, .xls"
            style="display: none"
          />
        </label>
      </div>

      <div id="activeView" style="display: none; margin-top: 8px">
        <div style="font-size: 11px; margin-bottom: 5px; color: #2d3436">
          Monitoring <b id="domainCount">0</b> domains.
        </div>
        <button id="clearDbBtn" class="icon-btn danger" style="width: 100%">
          🗑️ Clear / Switch Project
        </button>
      </div>
    </div>

    <!-- FORM FIELDS -->
    <div class="scroll-area">
      <label>Username</label> <input type="text" id="username" />
      <label>Email</label> <input type="email" id="email" />
      <label>Password</label> <input type="password" id="password" />

      <div class="grid">
        <div><label>First Name</label><input type="text" id="firstName" /></div>
        <div><label>Last Name</label><input type="text" id="lastName" /></div>
      </div>

      <label>Company / Brand</label> <input type="text" id="company" />
      <label>Website URL</label> <input type="text" id="website" />
      <label>Title / Subject</label> <input type="text" id="title" />
      <label>Category (Priority List)</label>
      <div style="display: flex; gap: 5px">
        <input
          type="text"
          id="category"
          placeholder="e.g. Beauty/Fashion/Lifestyle"
          style="flex-grow: 1"
        />
        <button
          id="catLockBtn"
          class="icon-btn"
          title="Lock Category (Prevent Auto-Change)"
          style="width: 30px; flex: none"
        >
          🔓
        </button>
      </div>

      <div class="grid">
        <div><label>Phone</label><input type="tel" id="phone" /></div>
        <div><label>Zip</label><input type="text" id="zip" /></div>
      </div>

      <label>Address</label> <input type="text" id="address" />

      <div class="grid">
        <div><label>City</label><input type="text" id="city" /></div>
        <div><label>State/Region</label><input type="text" id="region" /></div>
      </div>
      <label>Country</label>
      <input type="text" id="country" placeholder="United States" />

      <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0" />

      <label>Description / Bio (Rich Text or HTML)</label>
      <div id="masterInput" contenteditable="true"></div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <button id="saveButton" class="primary-btn">💾 Save Profile</button>

      <div class="io-actions">
        <button id="exportBtn" class="io-btn">⬇️ Backup (JSON)</button>
        <button id="importBtn" class="io-btn">⬆️ Restore</button>
        <input
          type="file"
          id="fileInput"
          style="display: none"
          accept=".json"
        />
      </div>
    </div>

    <!-- ⚡ BULK IMPORT MODAL -->
    <div
      id="bulkModal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
      "
    >
      <div
        style="
          background: white;
          width: 90%;
          height: 85%;
          margin: 20px auto;
          padding: 15px;
          border-radius: 8px;
          display: flex;
          flex-direction: column;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        "
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
          "
        >
          <h3 style="margin: 0">⚡ Smart Paste</h3>
          <span id="closeBulk" style="cursor: pointer; font-size: 20px"
            >&times;</span
          >
        </div>
        <p style="font-size: 11px; color: #666; margin-top: 0">
          Paste your client data dump here (Key: Value format works best).
        </p>
        <textarea
          id="bulkText"
          style="
            flex-grow: 1;
            width: 100%;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            border: 1px solid #ccc;
            resize: none;
            box-sizing: border-box;
          "
          placeholder="Username: jdoe&#10;Email: email@test.com&#10;Bio: We are the best agency..."
        ></textarea>
        <button
          id="processBulkBtn"
          class="primary-btn"
          style="margin-top: 10px"
        >
          🚀 Auto-Parse & Fill
        </button>
      </div>
    </div>

    <!-- STRATEGY DECISION MODAL -->
    <div
      id="strategyModal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 2000;
        backdrop-filter: blur(2px);
      "
    >
      <div
        style="
          background: white;
          width: 280px;
          margin: 150px auto;
          padding: 20px;
          border-radius: 12px;
          text-align: center;
          box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        "
      >
        <div style="font-size: 24px; margin-bottom: 10px">🤔</div>
        <h3 style="margin: 0 0 10px 0; color: #2d3436">Smart Paste Detected</h3>
        <p style="font-size: 12px; color: #636e72; margin-bottom: 20px">
          How should we format the <b>Title</b>?
        </p>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
          <button
            id="btnForumMode"
            style="
              padding: 12px;
              border: 1px solid #0984e3;
              background: #fff;
              color: #0984e3;
              border-radius: 8px;
              cursor: pointer;
              font-weight: bold;
              font-size: 12px;
              transition: all 0.2s;
            "
          >
            💬 FORUMS<br /><span
              style="font-size: 9px; font-weight: normal; color: #555"
              >(Use Anchor Text)</span
            >
          </button>

          <button
            id="btnClassifiedMode"
            style="
              padding: 12px;
              border: 1px solid #00b894;
              background: #fff;
              color: #00b894;
              border-radius: 8px;
              cursor: pointer;
              font-weight: bold;
              font-size: 12px;
              transition: all 0.2s;
            "
          >
            📰 CLASSIFIEDS<br /><span
              style="font-size: 9px; font-weight: normal; color: #555"
              >(Split at ';')</span
            >
          </button>
        </div>
        <div
          style="
            margin-top: 15px;
            font-size: 10px;
            color: #b2bec3;
            cursor: pointer;
            text-decoration: underline;
          "
          id="closeStrategy"
        >
          Cancel (Keep Title)
        </div>
      </div>
    </div>

    <script>
      // Hover effects for the new buttons (Inline for simplicity)
      document.getElementById("btnForumMode").onmouseenter = function () {
        this.style.background = "#0984e3";
        this.style.color = "white";
      };
      document.getElementById("btnForumMode").onmouseleave = function () {
        this.style.background = "#fff";
        this.style.color = "#0984e3";
      };

      document.getElementById("btnClassifiedMode").onmouseenter = function () {
        this.style.background = "#00b894";
        this.style.color = "white";
      };
      document.getElementById("btnClassifiedMode").onmouseleave = function () {
        this.style.background = "#fff";
        this.style.color = "#00b894";
      };
    </script>

    <script src="xlsx.mini.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
